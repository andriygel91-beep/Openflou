name: Build Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Free Disk Space & Setup Memory Swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo swapoff -a || true
          sudo rm -f /swapfile /swap /mnt/swapfile || true
          sudo fallocate -l 4G /mnt/swapfile \
            || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096 status=none \
            || echo "WARNING: swap creation failed, continuing"
          if [ -f /mnt/swapfile ]; then
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
            echo "Swap ready:"
          fi
          free -h

      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Без cache: npm — в проєкті немає package-lock.json

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📂 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 📦 Install Dependencies & Build Tools
        run: |
          npm install --legacy-peer-deps
          npm install expo-build-properties ajv@^8.12.0 ajv-keywords@^5.1.0 --legacy-peer-deps
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🏗️ Expo Prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: ⚙️ Configure Gradle Flags
        run: |
          cat >> android/gradle.properties <<EOF
          android.enableR8.fullMode=true
          android.enableResourceOptimizations=true
          android.nonTransitiveRClass=true
          reactNativeArchitectures=arm64-v8a
          hermesEnabled=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.workers.max=2
          EOF

          # Фикс версий Stripe
          find . -name "build.gradle" -type f \
            -exec sed -i "s/com.stripe:stripe-android:+/com.stripe:stripe-android:20.37.0/g" {} +

      - name: 🚀 Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --stacktrace
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m"

      - name: 📦 Upload Compact APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Release
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
